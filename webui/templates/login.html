{% import "_icons.html" as i %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Paper Review Automation</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- Matches webui/static/tray.ico's design: same brand gradient (--accent
       #4f46e5 -> #8b5cf6) and folded-corner document glyph. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='10%25' y1='0%25' x2='90%25' y2='100%25'><stop offset='0' stop-color='%234f46e5'/><stop offset='1' stop-color='%238b5cf6'/></linearGradient></defs><rect x='6' y='6' width='88' height='88' rx='20' fill='url(%23g)'/><path d='M32 28a3 3 0 0 1 3-3h21l12 12v34a3 3 0 0 1-3 3H35a3 3 0 0 1-3-3z' fill='%23fff'/><path d='M56 25l12 12H56z' fill='%23c7d2fe'/><rect x='41' y='54' width='10' height='3' rx='1.5' fill='%234f46e5' opacity='.5'/><rect x='41' y='61' width='18' height='3' rx='1.5' fill='%234f46e5' opacity='.5'/></svg>">
  <script>
    (function () {
      var saved = localStorage.getItem('theme') || 'auto';
      if (saved !== 'auto') document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</head>
<body class="login-page">
  <main>
    <section class="panel login-panel">
      <div class="panel-head">
        <h1>{{ i.icon('sparkle', 18) }} Paper Review Automation</h1>
      </div>

      {% if error %}
        <div class="note err">{{ i.icon('alert', 17) }}<span>{{ error }}</span></div>
      {% endif %}

      <form method="post" class="login-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username"
               required autofocus value="{{ username|default('') }}">

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required>

        <button type="submit" class="primary">Sign in</button>
      </form>

      <p class="hint">
        New here? <a href="{{ url_for('signup') }}">Sign up</a> — an
        administrator will need to approve it before you can sign in.
      </p>
    </section>
  </main>
</body>
</html>
